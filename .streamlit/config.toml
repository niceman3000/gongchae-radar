# 화면 색·모양 (11-20 디자인 정리). 키는 여기 넣지 않는다 (키는 secrets.toml, Git에 안 올라감)
[theme]
primaryColor = "#1C1B19"
backgroundColor = "#FCFBF8"  
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1B19"
baseRadius = "0.375rem"
borderColor = "#E3DED3"
showWidgetBorder = true

[client]
toolbarMode = "viewer"

[server]
headless = true
